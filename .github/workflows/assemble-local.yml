name: Assemble local fruit assets
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful workflow run ID containing the local-fruit-assets artifact
        required: false
        type: string
      source_release_tag:
        description: Release tag with MP4 attachments (ZIP also supported); leave run ID empty
        required: false
        type: string
      fruit:
        description: Fruit for MP4s with ordinary camera/export filenames
        type: choice
        options: [strawberry, apple, grapes, watermelon, orange, kiwi, peach]
        default: strawberry
      config:
        description: Six-second preview, original four-fruit timeline, or seven-fruit Shorts
        type: choice
        options: [configs/prototype.yaml, config.yaml, configs/shorts-seven.yaml]
        default: configs/prototype.yaml
      audio_profile:
        description: Original audio or optional glass brightness EQ (listening review required)
        type: choice
        options: [original, glass-bright]
        default: original
  workflow_call:
    inputs:
      source_release_tag:
        type: string
        required: true
      source_run_id:
        type: string
        default: ''
      fruit:
        type: string
        default: strawberry
      config:
        type: string
        default: configs/prototype.yaml
      audio_profile:
        type: string
        default: original
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONFIG: ${{ inputs.config }}
      AUDIO_PROFILE: ${{ inputs.audio_profile }}
      SOURCE_RUN: ${{ inputs.source_run_id }}
      SOURCE_TAG: ${{ inputs.source_release_tag }}
      FRUIT: ${{ inputs.fruit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install -r requirements.txt
      - name: Check source choice
        run: |
          if [ -n "$SOURCE_RUN" ] && [ -z "$SOURCE_TAG" ]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          elif [ -z "$SOURCE_RUN" ] && [ -n "$SOURCE_TAG" ]; then
            [[ "$SOURCE_TAG" != -* ]]
          else
            echo 'Specify exactly one source: run ID or release tag'; exit 1
          fi
      - name: Download release assets
        if: ${{ inputs.source_release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.[mM][pP]4' --pattern fruit-assets.zip --dir /tmp/fruit-input
          python -m glass_fruit import-assets --source /tmp/fruit-input --assets assets --fruit "$FRUIT"
          mkdir -p outputs
          cp assets/import-report.json outputs/import-report.json
      - uses: actions/download-artifact@v4
        if: ${{ inputs.source_run_id != '' }}
        with:
          name: local-fruit-assets
          path: assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Save independent six-second strawberry preview
        id: preview
        if: ${{ inputs.config != 'configs/prototype.yaml' && inputs.fruit == 'strawberry' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m glass_fruit --config configs/prototype.yaml prepare --assets assets --output-dir outputs/strawberry-preview --audio-profile original
          python -m glass_fruit --config configs/prototype.yaml assemble --manifest outputs/strawberry-preview/manifest.json --output outputs/STRAWBERRY-6S.mp4
          python -m glass_fruit --config configs/prototype.yaml validate outputs/STRAWBERRY-6S.mp4
      - name: Prepare and assemble
        run: |
          set -euo pipefail
          case "$CONFIG" in config.yaml|configs/prototype.yaml|configs/shorts-seven.yaml) ;; *) exit 1 ;; esac
          case "$AUDIO_PROFILE" in original|glass-bright) ;; *) exit 1 ;; esac
          python -m glass_fruit --config "$CONFIG" prepare --assets assets --output-dir outputs/prepared --audio-profile "$AUDIO_PROFILE"
          python -m glass_fruit --config "$CONFIG" assemble --manifest outputs/prepared/manifest.json --output outputs/GLASS-FRUIT.mp4
          python -m glass_fruit --config "$CONFIG" validate outputs/GLASS-FRUIT.mp4
      - name: Save default six-second preview filename
        if: ${{ success() && inputs.config == 'configs/prototype.yaml' }}
        run: cp outputs/GLASS-FRUIT.mp4 outputs/STRAWBERRY-6S.mp4
      - name: Upload six-second MP4
        if: ${{ always() && hashFiles('outputs/STRAWBERRY-6S.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: strawberry-6s-${{ github.run_id }}
          path: outputs/STRAWBERRY-6S.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Upload completed seven-fruit Shorts MP4
        if: ${{ success() && inputs.config == 'configs/shorts-seven.yaml' }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-70s-${{ github.run_id }}
          path: outputs/GLASS-FRUIT.mp4
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: glass-fruit-edit-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 7
      - name: Show result and download instructions
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## 素材の取り込みと編集結果', 'この実行の **Artifacts** から `glass-fruit-edit-' + os.environ['GITHUB_RUN_ID'] + '` を取得してください。']
          imported = Path('outputs/import-report.json')
          if imported.exists():
              report = json.loads(imported.read_text())
              lines.append('取り込み: ' + str(len(report['files'])) + '本（' + report['mode'] + '）')
          if Path('outputs/STRAWBERRY-6S.mp4').exists():
              lines.append('6秒のイチゴ版は完成しました。**Artifacts → strawberry-6s-' + os.environ['GITHUB_RUN_ID'] + '** に `STRAWBERRY-6S.mp4` があります。70秒版の不足とは独立して取得できます。')
          missing = Path('outputs/prepared/asset-report.json')
          if missing.exists():
              report = json.loads(missing.read_text())
              for entry in report['missing']:
                  lines.append('- ' + entry['fruit'] + ': あと ' + str(entry['missing_seconds']) + '秒の別素材が必要')
          if Path('outputs/GLASS-FRUIT.mp4').exists():
              lines.append('完成MP4: `GLASS-FRUIT.mp4`。再生して音と映像を確認してください。')
              if os.environ['CONFIG'] == 'configs/shorts-seven.yaml':
                  lines.append('70秒Shorts専用: **Artifacts → youtube-shorts-70s-' + os.environ['GITHUB_RUN_ID'] + '**')
          else:
              lines.append('選択した本編は未完成です。6秒版の有無は上記を確認し、不足素材または実行ログを確認してください。')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('\n\n'.join(lines) + '\n')
          PY
